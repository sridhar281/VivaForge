# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo in the Render dashboard and it will read this file.
# You still need to set GROQ_API_KEY and JWT_SECRET_KEY manually in the
# Render dashboard (never commit real secrets here).

services:
  - type: web
    name: vivaforge-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vivaforge-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false # set manually in the dashboard
      - key: GROQ_API_KEY
        sync: false # set manually in the dashboard — get a free key at https://console.groq.com/keys
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://your-frontend.vercel.app # update after deploying the frontend

databases:
  - name: vivaforge-db
    plan: free
    databaseName: vivaforge
    user: vivaforge
