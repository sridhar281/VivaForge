services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vivaforge
      POSTGRES_PASSWORD: vivaforge
      POSTGRES_DB: vivaforge
    ports:
      - "5432:5432"
    volumes:
      - vivaforge_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivaforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://vivaforge:vivaforge@db:5432/vivaforge
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - vivaforge_storage:/app/storage

volumes:
  vivaforge_db_data:
  vivaforge_storage:
